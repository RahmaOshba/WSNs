# Packet-level runs: the thesis protocols over INET's IEEE 802.15.4.
# Same deployment as the analytical runs (100 nodes, 100 x 100 m, 0.5 J, seed 12345),
# same protocol decisions; every message is a real frame (CSMA/CA, ACKs, retransmissions,
# collisions) and every frame the MAC sends or receives is charged with the first-order model.
#
#   ./run -u Cmdenv -c v8_chain_center        ./run -c v8_chain_center   (GUI)
#   ./run_all.sh  then  python3 compare.py     (packet level vs analytical)

[General]
network = pktwsn.PacketWsn
cmdenv-express-mode = true
cmdenv-status-frequency = 60s
*.radioMedium.radioModeFilter = true    # a sleeping radio receives nothing (TDMA); also makes the runs much faster
**.vector-recording = false
**.brain.*.vector-recording = true

# ---------------- positions: the thesis deployment, mt19937(seed), x then y per node ----------------
*.brain.seed = ${seed=12345}
*.sensor[*].mobility.initialX = wsnPos(${seed}, ancestorIndex(1), 0, 100m)
*.sensor[*].mobility.initialY = wsnPos(${seed}, ancestorIndex(1), 1, 100m)
*.sink.mobility.initialX = 50m
*.sink.mobility.initialY = 50m
*.*.mobility.typename = "StationaryMobility"
*.*.mobility.initFromDisplayString = false
*.*.mobility.updateFromDisplayString = false
*.*.mobility.initialZ = 0m
*.visualizer.sceneVisualizer.viewScale = "4 4"
*.visualizer.sceneVisualizer.viewTranslation = "20 20"

# ---------------- every node: one application, UDP/IPv4 over IEEE 802.15.4 ----------------
*.sink.numApps = 1
*.sink.app[0].typename = "NodeAgent"
*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "NodeAgent"
*.configurator.config = xml("<config><interface hosts='**' address='10.0.x.x' netmask='255.255.0.0'/></config>")
**.arp.typename = "GlobalArp"
**.ipv4.ip.limitedBroadcast = true   # broadcasts (ADV, schedule, ...) to 255.255.255.255 go out on the radio
# the first-order model assumes the radio reaches the receiver (power control);
# 10 mW lets every node reach every other node and the BS, also the far BS
**.wlan[0].radio.transmitter.power = 10mW
# energy is accounted by the first-order radio model (NodeAgent), not by INET's battery
*.sink.energyStorage.typename = ""
*.sensor[*].energyStorage.typename = ""
**.wlan[0].radio.energyConsumer.typename = ""

# ---------------- GUI ----------------
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.packetFilter = "DATA* or AGG*"
*.visualizer.mediumVisualizer.displaySignals = false

[Config leach_center]
description = "LEACH (EDITED), BS at the centre, packet level"
*.brain.protocol = "leach"

[Config v8_center]
description = "v8 (direct to the BS), BS at the centre, packet level"
*.brain.protocol = "v8"
*.brain.chainMode = 0

[Config v8_chain_center]
description = "v8-Chain (energy-aware relay), BS at the centre, packet level"
*.brain.protocol = "v8"
*.brain.chainMode = 2

[Config leach_farBS]
description = "LEACH (EDITED), BS at (50,-100), packet level"
*.brain.protocol = "leach"
*.brain.bsY = -100m
*.sink.mobility.initialY = -100m
*.visualizer.sceneVisualizer.viewScale = "2.5 2.5"
*.visualizer.sceneVisualizer.viewTranslation = "20 270"

[Config v8_farBS]
description = "v8 (direct), BS at (50,-100), packet level"
extends = leach_farBS
*.brain.protocol = "v8"
*.brain.chainMode = 0

[Config v8_chain_farBS]
description = "v8-Chain, BS at (50,-100), packet level"
extends = leach_farBS
*.brain.protocol = "v8"
*.brain.chainMode = 2

# Parallel cluster slots: every cluster uses its TDMA slots at the same time (as if every cluster had
# its own channel / CDMA code, like the LEACH paper). On one shared 802.15.4 channel this causes contention.
[Config ParallelSlots]
description = "LEACH, v8, v8-Chain with per-cluster slots used in parallel (contention between clusters)"
*.brain.protocol = ${protocol="leach","v8","v8"}
*.brain.chainMode = ${chainMode=0,0,2 ! protocol}
*.brain.slotMode = "perCluster"

# JOIN contention: with a 0.4 s JOIN window ~11% of the JOINs collide (CSMA); a member that is not
# in its CH's schedule sends straight to the BS, which is very expensive when the BS is far.
[Config ShortJoinWindow]
description = "LEACH, v8, v8-Chain with a 0.4 s JOIN window (JOIN collisions), centre and far BS"
*.brain.joinWindow = 0.4s
*.brain.protocol = ${protocol="leach","v8","v8"}
*.brain.chainMode = ${chainMode=0,0,2 ! protocol}
*.brain.bsY = ${bsY=50m,-100m}
*.sink.mobility.initialY = ${bsY}
