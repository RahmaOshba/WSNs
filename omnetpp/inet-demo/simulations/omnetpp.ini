# INET version of the clustered demo (code/0_FIRST_EXPERIMENTS/demo_clustered_wsn.cc).
# Same scenario as the ns-3 demo: 12 sensors in 3 clusters + sink, 6 rounds of 10 s,
# CH = most energy among the nodes that have not been CH in this epoch,
# members send a 40-byte reading in their TDMA slot, the CH fuses and sends one packet to the sink.
# Real IEEE 802.15.4 (INET Ieee802154NarrowbandInterface: CSMA/CA MAC with ACKs, 250 kb/s,
# scalar radio channel) and battery energy from the radio state (same currents as the ns-3 demo).
#
# Run (GUI):  ./run            Run (command line):  ./run -u Cmdenv

[General]
network = inetdemo.ClusterDemo
sim-time-limit = 61s
cmdenv-express-mode = false
**.cmdenv-log-level = info
**.coordinator.rounds = 6

# ---------------- positions (metres), same as the ns-3 demo ----------------
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false
**.mobility.initialZ = 0m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 80m
**.mobility.constraintAreaMaxY = 60m
*.sink.mobility.initialX = 40m
*.sink.mobility.initialY = 10m
*.sensor[0].mobility.initialX = 6m
*.sensor[0].mobility.initialY = 40m
*.sensor[1].mobility.initialX = 18m
*.sensor[1].mobility.initialY = 39m
*.sensor[2].mobility.initialX = 7m
*.sensor[2].mobility.initialY = 51m
*.sensor[3].mobility.initialX = 19m
*.sensor[3].mobility.initialY = 50m
*.sensor[4].mobility.initialX = 34m
*.sensor[4].mobility.initialY = 40m
*.sensor[5].mobility.initialX = 46m
*.sensor[5].mobility.initialY = 39m
*.sensor[6].mobility.initialX = 35m
*.sensor[6].mobility.initialY = 51m
*.sensor[7].mobility.initialX = 47m
*.sensor[7].mobility.initialY = 50m
*.sensor[8].mobility.initialX = 62m
*.sensor[8].mobility.initialY = 40m
*.sensor[9].mobility.initialX = 74m
*.sensor[9].mobility.initialY = 39m
*.sensor[10].mobility.initialX = 63m
*.sensor[10].mobility.initialY = 51m
*.sensor[11].mobility.initialX = 75m
*.sensor[11].mobility.initialY = 50m
*.visualizer.sceneVisualizer.viewScale = "8 8"

# ---------------- applications ----------------
*.sink.numApps = 1
*.sink.app[0].typename = "ClusterApp"
*.sink.app[0].isSink = true
*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "ClusterApp"

# ---------------- network layer: static IPv4, no ARP traffic ----------------
*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")
**.arp.typename = "GlobalArp"
**.ipv4.ip.limitedBroadcast = true   # broadcasts (ADV, schedule, ...) to 255.255.255.255 go out on the radio

# ---------------- energy: battery + radio-state consumer (ns-3 demo currents at 3.3 V) ----------------
*.sensor[*].hasStatus = true    # SimpleEpEnergyStorage needs the node status (a node shuts down when its battery is empty)
*.sensor[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.sensor[*].energyStorage.nominalCapacity = 20J
*.sink.energyStorage.typename = "IdealEpEnergyStorage"
**.wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.energyConsumer.offPowerConsumption = 0mW
**.energyConsumer.sleepPowerConsumption = 0mW
**.energyConsumer.switchingPowerConsumption = 3.3mW
**.energyConsumer.receiverIdlePowerConsumption = 62.7mW
**.energyConsumer.receiverBusyPowerConsumption = 62.7mW
**.energyConsumer.receiverReceivingPowerConsumption = 62.7mW
**.energyConsumer.transmitterIdlePowerConsumption = 3.3mW
**.energyConsumer.transmitterTransmittingPowerConsumption = 56.1mW

# ---------------- visualization ----------------
*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.mediumVisualizer.signalPropagationAnimationSpeed = 500/3e8
*.visualizer.mediumVisualizer.signalTransmissionAnimationSpeed = 50000/3e8
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.packetFilter = "reading* or fused* or ADV*"
*.visualizer.physicalLinkVisualizer.displayLinks = false
*.visualizer.energyStorageVisualizer.displayEnergyStorages = true
*.visualizer.infoVisualizer.displayInfos = false
