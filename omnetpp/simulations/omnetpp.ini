# ======================================================================
# Extra experiments (results/far_bs and results/4_PROPOSED/extra)
# ======================================================================
[Config FarBS]
description = "EDITED / IMPROVED / v3 / v5b with the BS far away, (50,-100)"
**.controller.protocol = ${protocol="leach_EDITED", "heed_EDITED", "heed_fairness_EDITED", "pegasis_EDITED", "shleach_EDITED", "hleach_EDITED", "eechheed_EDITED", "shleach_IMPROVED", "hleach_IMPROVED", "eechheed_IMPROVED", "v3_single_pass_reuse_int5", "v5b_energy_aware_repair"}
**.controller.defines = "BS_Y=-100"

[Config Ablation]
description = "v8 with one improvement (I1..I5) switched off"
**.controller.protocol = "v8_center"
**.controller.defines = ${without="I1","I2","I3","I4","I5"} + "=0"

[Config Routing]
description = "v8-Chain routing modes: 0 direct (= v8), 1 ordered chain, 2 energy-aware relay"
**.controller.protocol = ${place="v8_chain_center","v8_chain_farBS"}
**.controller.defines = "CHAIN_MODE=" + "${mode=0,1,2}"

[Config Robustness]
description = "v5b / v8 / v8-Chain over 8 random topologies"
**.controller.protocol = ${protocol="v5b_energy_aware_repair","v8_center","v8_chain_center","v8_farBS","v8_chain_farBS"}
**.controller.defines = "TOPO_SEED=" + "${seed=1,7,42,99,555,2024,12345,31337}"

# ----------------------------------------------------------------------
# Security scenarios of the thesis proposal (ECC + AES), as in
# results/4_PROPOSED/extra/security_proposal. Energy figures and sources:
# results/README.md. Switches (all 0 = no security):
#   SEC_BITS        extra bits per frame (AES-CCM* header + MIC-64 = 104)
#   SEC_NJ_PER_BIT  symmetric cipher energy per bit (hardware AES = 5 nJ/bit)
#   SEC_SETUP_MJ    one public-key key agreement per node at deployment
#   SEC_AUTH_MJ     public-key operation for every newly elected CH
#   SEC_PK_TX_MJ / SEC_PK_RX_MJ   public-key operation on every data packet
#   SEC_PK_BS_MJ    public-key operation on every packet sent to the sink
#   SEC_KEYDIST=1   the sink sends each node the new cluster key at set-up
# ----------------------------------------------------------------------
[Config SecurityBase]
abstract = true
**.controller.label = "${scenario=s0_none, s1_aes_only, s2_hybrid_rsa, s3_hybrid_ecc, s4_full_ecc, s5_full_rsa, s6_once_rsa, s7_once_ecc, s8_bs_ecc, s9_bs_rsa, s10_ecc160_aes, s11_p256_aes, s12_ecc160_ecdsa, s13_ecc160_swaes, s14_x25519_aes, s15_rsa3072_aes, s16_rsa1024_aes}"
**.controller.defines = ${defines="", "SEC_BITS=104 SEC_NJ_PER_BIT=5", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_AUTH_MJ=15.4", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_AUTH_MJ=22.3", "SEC_BITS=336 SEC_NJ_PER_BIT=5 SEC_PK_TX_MJ=22.3 SEC_PK_RX_MJ=22.3", "SEC_BITS=1072 SEC_PK_TX_MJ=35.7 SEC_PK_RX_MJ=912", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=15.4", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=22.3", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_PK_BS_MJ=22.3", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_PK_BS_MJ=35.7", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=22.3 SEC_KEYDIST=1", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=90 SEC_KEYDIST=1", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=22.3 SEC_KEYDIST=1 SEC_AUTH_MJ=22.82", "SEC_BITS=104 SEC_NJ_PER_BIT=50 SEC_SETUP_MJ=22.3 SEC_KEYDIST=1", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=48 SEC_KEYDIST=1", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=139 SEC_KEYDIST=1", "SEC_BITS=104 SEC_NJ_PER_BIT=5 SEC_SETUP_MJ=15.4 SEC_KEYDIST=1" ! scenario}

[Config Security_LEACH_center]
extends = SecurityBase
**.controller.protocol = "leach_EDITED"

[Config Security_LEACH_far]
extends = SecurityBase
**.controller.extraDefines = "BS_Y=-100"
**.controller.protocol = "leach_EDITED"

[Config Security_PEGASIS_center]
extends = SecurityBase
**.controller.protocol = "pegasis_EDITED"

[Config Security_PEGASIS_far]
extends = SecurityBase
**.controller.extraDefines = "BS_Y=-100"
**.controller.protocol = "pegasis_EDITED"

[Config Security_v8_center]
extends = SecurityBase
**.controller.protocol = "v8_chain_center"

[Config Security_v8_far]
extends = SecurityBase
**.controller.protocol = "v8_chain_farBS"
