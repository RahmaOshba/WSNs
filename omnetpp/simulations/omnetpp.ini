# OMNeT++ port of the thesis simulations.
#
#   one configuration per ns-3 program  ->  same name as code/<group>/<name>.cc
#   + the extra experiments: far BS, v8 ablation, v8-Chain routing modes,
#     robustness over 8 topologies, and the security scenarios.
#
# Run one:   ./run -c v8_chain_center            (GUI:  ./run -u Qtenv -c v8_chain_center)
# Run all:   ./run_all.sh   then   python3 validate.py
#
# "defines" takes the same switches as the ns-3 -D flags (see code/README.md), e.g.
#   **.controller.defines = "BS_Y=-100 I4=0"

[General]
network = wsn.WsnNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 10s
**.controller.verbose = false
**.controller.roundDuration = 1s
# per-round network vectors (alive, chCount, residualEnergy, ...) are recorded;
# the per-node energy vector is large (nodes x rounds), switch it on when needed
**.node[*].energy.vector-recording = false
# ns-3 style CSV files (results.csv, node-energy.csv, node-lifetime.csv): uncomment
#**.controller.csvDir = "${resultdir}/csv/${configname}-${runnumber}"

